name: Build APK

# Build APK debug (cài sideload) mỗi lần push lên main và mỗi lần tạo tag v*.
# Khi có tag v* thì tạo GitHub Release và đính kèm file APK để app tự cập nhật.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode game image assets
        run: bash scripts/decode-assets.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor web assets
        run: npx cap sync android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Khong dung android-actions/setup-android nua: action nay goi
      # `sdkmanager tools` nhung goi `tools` da bi Google xoa khoi SDK
      # (loi "Failed to find package 'tools'"), nen step nay luon fail.
      # Runner ubuntu-latest da cai san Android SDK o
      # /usr/local/lib/android/sdk, Gradle tu tim thay qua ANDROID_HOME.
      #
      # Khong dung gradle/actions/setup-gradle nua: tu 2026 services.gradle.org
      # chuyen huong file tai ve sang GitHub Releases, khi GitHub bi su co
      # (HTTP 504) thi buoc provision cua action nay luon that bai. Tai Gradle
      # bang curl voi nhieu lan thu lai de chiu dung loi mang tam thoi.
      - name: Download Gradle 8.2.1 (co thu lai khi loi mang)
        run: |
          ZIP="$RUNNER_TEMP/gradle-8.2.1-bin.zip"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            echo "Lan thu tai Gradle: $attempt"
            if curl -fSL --retry 5 --retry-delay 15 --retry-all-errors \
                 --connect-timeout 30 -o "$ZIP" \
                 https://services.gradle.org/distributions/gradle-8.2.1-bin.zip; then
              ok=1
              break
            fi
            rm -f "$ZIP"
            sleep 45
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Khong tai duoc Gradle 8.2.1 sau 6 lan thu"
            exit 1
          fi
          unzip -q "$ZIP" -d "$RUNNER_TEMP/gradle-dist"
          echo "$RUNNER_TEMP/gradle-dist/gradle-8.2.1/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk phieu-luu-thu-thap-sao.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phieu-luu-thu-thap-sao-apk
          path: phieu-luu-thu-thap-sao.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: phieu-luu-thu-thap-sao-apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: phieu-luu-thu-thap-sao.apk
          generate_release_notes: true
