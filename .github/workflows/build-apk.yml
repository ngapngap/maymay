name: Build APK

# Build APK debug (cài sideload) mỗi lần push lên main và mỗi lần tạo tag v*.
# Khi có tag v* thì tạo GitHub Release và đính kèm file APK để app tự cập nhật.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode game image assets
        run: bash scripts/decode-assets.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor web assets
        run: npx cap sync android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk phieu-luu-thu-thap-sao.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phieu-luu-thu-thap-sao-apk
          path: phieu-luu-thu-thap-sao.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: phieu-luu-thu-thap-sao-apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          files: phieu-luu-thu-thap-sao.apk
          generate_release_notes: true
